interface:
  display_name: "$中式学生:review"
  short_description: "复盘考试错误并更新学习反馈"
  default_prompt: "Use $chinese-student:review [exam-result|user-written]. Default to exam-result: directly read original PDFs, run Material Review for any answerer, and run Learner Review only for eligible human evidence. Use user-written only when the user explicitly submits their own PDF answer sheet. Review never generates PDF."
